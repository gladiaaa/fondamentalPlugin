name: CI

on:
  pull_request:
  push:
    branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRISMA_HIDE_UPDATE_MESSAGE: "1"

jobs:
  # Les noms des jobs servent de vérifications obligatoires dans les règles
  # des branches : les renommer impose de mettre ces règles à jour.
  verifier:
    name: Lint, types et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api-e2e:
    name: Tests e2e de l'API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fondamental
          POSTGRES_PASSWORD: fondamental
          POSTGRES_DB: fondamental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fondamental -d fondamental"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fondamental:fondamental@localhost:5432/fondamental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy -w @fondamental/api
      - run: npm run test:e2e -w @fondamental/api

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  docker-api:
    name: Image Docker de l'API
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: false
          cache-from: type=gha,scope=api-migrate
          cache-to: type=gha,mode=max,scope=api-migrate
