# ============================================================
#  FondamentalPass - quêtes
# ============================================================
# DIFFICULTÉS : du plus facile au plus dur (cet ordre sert au tri dans les menus).
#   name  : nom affiché (MiniMessage, balises de la charte)
#   stars : nombre d'étoiles pleines
#
# POOLS : groupes de quêtes tirées au hasard et renouvelées ensemble.
#   reset  : daily (chaque jour à config.yml > reset-hour), weekly (le lundi), season (jamais)
#   amount : nombre de quêtes tirées par joueur, "all" pour toutes,
#            ou un tirage par difficulté : {facile: 2, normal: 1, difficile: 1}
#   completion : bonus quand toutes les quêtes de la période sont terminées
#            {xp: 500, rewards: [...]} (mêmes récompenses que season.yml)
#
# QUÊTES :
#   pool, difficulty, name, description (<amount> = quantité demandée), icon, xp,
#   weight (chance d'être tirée, 10 par défaut)
#   servers : serveurs où la quête progresse, motifs avec * (ex. ["bedwars-*"]).
#             Absent ou ["*"] = tout le réseau. Nom du serveur : config.yml > server.name
#   where   : nom affiché aux joueurs pour ces serveurs (ex. "Bedwars") ; sinon déduit des motifs
#   rewards : récompenses en plus de l'XP (mêmes types que season.yml)
#   objective :
#     type : break-block | place-block | kill-mob | kill-player | craft | fish | smelt
#            | enchant | consume | breed | playtime (minutes) | walk (blocs) | login (jours)
#            | custom (Premium) | placeholder (Premium)
#     amount : quantité à atteindre
#     materials / entities / items : filtre facultatif (noms Minecraft)
#     key : pour custom, la clé envoyée par un plugin ou /pass admin trigger
#           FondamentalBedwars : bedwars:play, bedwars:win, bedwars:kill, bedwars:final_kill, bedwars:bed_break
#           FondamentalCrate   : crate:open, crate:open:<id de la crate>
#     placeholder + mode : pour placeholder, la valeur à suivre ;
#            mode increase = compter la hausse depuis le tirage, reach = atteindre la valeur

difficulties:
  facile:
    name: "<ok>Facile"
    stars: 1
  normal:
    name: "<info>Normale"
    stars: 2
  difficile:
    name: "<alerte>Difficile"
    stars: 3
  extreme:
    name: "<erreur>Extrême"
    stars: 4

pools:
  daily:
    name: "Quêtes du jour"
    icon: SUNFLOWER
    reset: daily
    amount: {facile: 2, normal: 1, difficile: 1}
    completion:
      xp: 500
  weekly:
    name: "Quêtes de la semaine"
    icon: CLOCK
    reset: weekly
    amount: {normal: 1, difficile: 1, extreme: 1}
    completion:
      xp: 2500
      rewards:
        - {type: crate-key, crate: "vote", amount: 1}
  season:
    name: "Défis de saison"
    icon: NETHER_STAR
    reset: season
    amount: all

