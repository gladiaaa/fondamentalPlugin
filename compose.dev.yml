# Services pour le développement local (pas pour le VPS : voir deploy/).
#   docker compose -f compose.dev.yml up -d     # démarrer
#   docker compose -f compose.dev.yml down      # arrêter (les données restent)
#   docker compose -f compose.dev.yml down -v   # arrêter et effacer les données
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fondamental
      POSTGRES_PASSWORD: fondamental
      POSTGRES_DB: fondamental
    # Uniquement accessible depuis la machine.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fondamental -d fondamental"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
