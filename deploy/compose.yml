# Conteneur du site sur le VPS : une copie par environnement dans
# /opt/fondamentalplugin/<dev|prod>/compose.yml (voir deploy/README.md).
# Les variables viennent de .env (APP_ENV, HOST_PORT) et de deploy.env (IMAGE_TAG),
# écrit par deploy.sh à chaque déploiement.
services:
  web:
    image: ghcr.io/gladiaaa/fondamentalplugin:${IMAGE_TAG:?IMAGE_TAG manquant}
    container_name: fondamentalplugin-${APP_ENV:?APP_ENV manquant}
    restart: unless-stopped
    # Écoute uniquement en local : nginx (HTTPS) fait le lien avec Internet.
    ports:
      - "127.0.0.1:${HOST_PORT:?HOST_PORT manquant}:3000"
    # Secrets de l'application (Stripe, licences...) : fichier présent uniquement sur le VPS.
    env_file:
      - app.env
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
