# Umami (mesure d'audience, #33). À copier dans /etc/nginx/sites-available/fondamentalplugin-stats,
# activer (lien dans sites-enabled), puis `certbot --nginx -d stats.fondamentalplugin.fr` ajoute le
# HTTPS. Fait par deploy/umami/install.sh.
server {
    listen 80;
    listen [::]:80;
    server_name stats.fondamentalplugin.fr;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
}
