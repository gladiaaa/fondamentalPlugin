# À copier dans /etc/nginx/snippets/fondamentalplugin-api-dev.conf, puis inclure dans le
# bloc « server » HTTPS de dev.fondamentalplugin.fr :
#     include snippets/fondamentalplugin-api-dev.conf;
# Toutes les requêtes /api/* vont à l'API (le site n'a plus de route /api publique).

# ─── Préproduction protégée par mot de passe ─────────────────────
# Tout dev.fondamentalplugin.fr (site et API) demande un identifiant et un mot de passe, sauf les
# appels automatiques qui ont déjà leur propre protection (plus bas). Fichier des comptes :
# /etc/nginx/fondamentalplugin-dev.htpasswd (voir deploy/README.md, « Mot de passe de la préprod »).
auth_basic "Préproduction Fondamental";
auth_basic_user_file /etc/nginx/fondamentalplugin-dev.htpasswd;
# Jamais indexée par les moteurs de recherche.
add_header X-Robots-Tag "noindex, nofollow" always;

location /api/ {
    proxy_pass http://127.0.0.1:4101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 1m;
}

# Publication des versions par la CI des plugins (docs/release-plugin.md) : jars jusqu'à 50 Mo
# (RELEASES_MAX_UPLOAD_MB), marge comprise pour l'enveloppe multipart.
# Sans mot de passe : la route exige déjà le jeton RELEASES_TOKEN.
location /api/admin/releases/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:4101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 60m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Webhook Stripe : sans mot de passe (Stripe ne sait pas en envoyer), chaque appel est signé et
# vérifié par l'API (STRIPE_WEBHOOK_SECRET).
location = /api/stripe/webhook {
    auth_basic off;
    proxy_pass http://127.0.0.1:4101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 1m;
}

# Santé : vérification après chaque déploiement (deploy.yml) et supervision (UptimeRobot).
# Ne donne que la version et l'état de la base.
location = /api/health {
    auth_basic off;
    proxy_pass http://127.0.0.1:4101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
