# Cookie d'accès à la préproduction (dev.fondamentalplugin.fr), à installer dans le contexte « http »
# de nginx : /etc/nginx/conf.d/fondamentalplugin-preprod-acces.conf (voir deploy/README.md,
# « Mot de passe de la préprod »). __JETON__ est remplacé à l'installation par un jeton aléatoire,
# qui ne quitte jamais le VPS.
#
# Pourquoi : le mot de passe (authentification HTTP) n'est renvoyé par le navigateur que pour
# certaines requêtes ; les appels faits par le site en arrière-plan (/api/auth/me…) et la navigation
# privée le perdaient, d'où un mot de passe redemandé à chaque page et une session qui semblait
# fermée. Une fois le mot de passe accepté, nginx pose ce cookie ; tant qu'il est là, plus de mot de
# passe à saisir (api-dev.conf).

# Cookie valide : authentification HTTP désactivée pour cette requête.
map $cookie_fp_preprod $fp_preprod_realm {
    "__JETON__" off;
    default     "Préproduction Fondamental";
}

# Cookie posé sur les réponses réussies du site (jamais sur un refus 401 : voir api-dev.conf).
map $host $fp_preprod_cookie {
    default "fp_preprod=__JETON__; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax";
}
